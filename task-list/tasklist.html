<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task List</title>
</head>

<body>
    <h1>Our Fancy Tasks List </h1>
    <input type="text" id="newTask" placeholder="enter a new task">
    <button id="addTask"> Add Task</button>

    <ul id="taskList">

    </ul>

    <script>
        var taskList = [];
       // taskList.push("Brush Teeth");
       // taskList.push("Go to class");

       var taskButton = document.querySelector("#addTask");
       var taskInput = document.querySelector("#newTask");


        function addTask(task) {
            taskList.push(task);
        }

        function renderList() {
var listElement = document.querySelector("#taskList");
            listElement.innerHTML = "";
            //read tasklist array and properly render it to the page

            //loop through each item. one by one, in our taskList
            for (var i=0; i<taskList.length; i++) {
                var listItem = '<li>' + taskList[i] + '</li>';
                listElement.innerHTML += listItem;
            }
        }

        taskButton.addEventListener("click", function () {
            var taskText = taskInput.value;

            if (taskText.length > 0) {
                addTask(taskText);
                renderList();
            } else {
                alert("Please enter a task!");
            }
            

           // addTask(taskText);

            //renderList();
           // console.log(taskList);
        })

        addTask("go to lunch");
        addTask("go to the gym");








        console.log(taskList); 
    </script>

</body>

</html>
