<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book</title>
</head>
<body>

    <h1 id="title"></h1>
    <p id="desc"></p>

    <script>
         const params = new URLSearchParams(window.location.search);
  const title = params.get("title");

  fetch(`https://openlibrary.org/search.json?title=${encodeURIComponent(title)}`)
    .then(res => res.json())
    .then(data => {
      const book = data.docs[0];
      console.log(book);

      const workKey = book.key; // 👈 THIS is your "/works/OL9475257W"

      return fetch(`https://openlibrary.org${workKey}.json`);
    })
    .then(res => res.json())
    .then(work => {

      console.log(work);

      document.getElementById("title").textContent = work.title;

      document.getElementById("desc").textContent =
        work.description?.value ||
        work.description ||
        "No description available.";

    })
    .catch(err => console.error(err));
    </script>

<style>
  body {
      font-family: serif;
      padding: 40px;
      background: #F8EDE4;
  }
  
  h1 {
      font-size: 36px;
  }
  
  p {
      font-size: 18px;
      max-width: 600px;
  }
  </style>

</body>
</html>
